name: delta-management
x-runtime: &runtime
  env_file: .env.production
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
services:
  app:
    <<: *runtime
    image: delta-management-app:${DELTA_RELEASE:-local}
    build: {context: ., target: app}
    ports: ["127.0.0.1:3010:3010"]
    mem_limit: 2g
    cpus: 1.25
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s
  worker:
    <<: *runtime
    profiles: ["worker"]
    image: delta-management-worker:${DELTA_RELEASE:-local}
    build: {context: ., target: worker}
    mem_limit: 1g
    cpus: 0.65
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');try{process.exit(Date.now()-Number(fs.readFileSync('/tmp/delta-worker-heartbeat','utf8'))<240000?0:1)}catch{process.exit(1)}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
